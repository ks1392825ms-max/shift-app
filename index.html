<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 安全装置（CSP）：プログラムはこのアプリ自身のファイルだけを読み込む。
       通信してよいのは、共有モードで使う Firebase（データの保存・メールリンクのログイン・ログイン状態の維持）だけ。
       「この端末だけで使う」モードのときは、Firebase の部品を読み込まないので、どこにも通信しない。 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; form-action 'none'">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <title>シフト管理</title>
  <!-- iPhone・Mac の「ホーム画面に追加」「Dockに追加」用（アイコン・アプリ名・全画面表示） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="シフト">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-title">SHIFT</h1>
      <span class="app-subtitle" id="screen-title"></span>
      <!-- 共有モードのときだけ表示 -->
      <span class="mode-badge" id="mode-badge" hidden></span>
      <!-- 表示する店舗（すべての画面で共通） -->
      <div class="segment segment--compact store-switch header-store" id="store-switch" role="group" aria-label="表示する店舗"></div>
    </div>
  </header>

  <main class="screen" id="screen"></main>

  <nav class="bottom-nav" aria-label="画面の切り替え">
    <div class="bottom-nav__inner">
      <button type="button" class="bottom-nav__btn" data-screen="roster">
        <span class="bottom-nav__icon" aria-hidden="true">▦</span>シフト表
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="staff">
        <span class="bottom-nav__icon" aria-hidden="true">◉</span>スタッフ別
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="summary">
        <span class="bottom-nav__icon" aria-hidden="true">▤</span>集計
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="requests">
        <span class="bottom-nav__icon" aria-hidden="true">✉</span>申請
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="settings">
        <span class="bottom-nav__icon" aria-hidden="true">⚙</span>設定
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 読み込む順番が大事：共通の道具 → 初期データ → 保存 → 祝日・計算・チェック → 画面 → 起動 -->
  <script src="js/utils.js" defer></script>
  <script src="js/data/defaults.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/cloud.js" defer></script>
  <script src="js/backup.js" defer></script>
  <script src="js/holidays.js" defer></script>
  <script src="js/calc.js" defer></script>
  <script src="js/rules.js" defer></script>
  <script src="js/requests.js" defer></script>
  <script src="js/autoshift.js" defer></script>
  <script src="js/published.js" defer></script>
  <script src="js/export.js" defer></script>
  <script src="js/screens/roster.js" defer></script>
  <script src="js/screens/day.js" defer></script>
  <script src="js/screens/staff-view.js" defer></script>
  <script src="js/screens/summary.js" defer></script>
  <script src="js/screens/settings-stores.js" defer></script>
  <script src="js/screens/settings-staff.js" defer></script>
  <script src="js/screens/settings-patterns.js" defer></script>
  <script src="js/screens/settings-business.js" defer></script>
  <script src="js/screens/settings-staffing.js" defer></script>
  <script src="js/screens/settings-checks.js" defer></script>
  <script src="js/screens/settings-data.js" defer></script>
  <script src="js/screens/settings.js" defer></script>
  <script src="js/screens/login.js" defer></script>
  <script src="js/screens/request.js" defer></script>
  <script src="js/screens/requests-admin.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
