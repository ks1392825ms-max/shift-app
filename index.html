<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 外部への通信（fetch など）をすべて禁止する安全装置。同期機能を追加するときだけ、確認のうえで変更する -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
  <title>家計簿</title>
  <!-- iPhone の「ホーム画面に追加」用（アイコン・アプリ名・全画面表示） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-title">家計簿</h1>
      <span class="app-subtitle" id="screen-title"></span>
    </div>
  </header>

  <main class="screen" id="screen"></main>

  <nav class="bottom-nav" aria-label="画面の切り替え">
    <div class="bottom-nav__inner">
      <button type="button" class="bottom-nav__btn" data-screen="home">
        <span class="bottom-nav__icon" aria-hidden="true">⌂</span>ホーム
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="list">
        <span class="bottom-nav__icon" aria-hidden="true">≡</span>明細
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="summary">
        <span class="bottom-nav__icon" aria-hidden="true">◔</span>集計
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="balance">
        <span class="bottom-nav__icon" aria-hidden="true">¥</span>残り
      </button>
      <button type="button" class="bottom-nav__btn" data-screen="settings">
        <span class="bottom-nav__icon" aria-hidden="true">⚙</span>設定
      </button>
    </div>
  </nav>

  <!-- どの画面からでも入力画面を開けるボタン -->
  <button type="button" class="fab" id="fab" aria-label="入力する">＋</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 読み込む順番が大事：共通の道具 → 初期データ → 保存 → 計算・グラフ → 画面 → 起動 -->
  <script src="js/utils.js" defer></script>
  <script src="js/data/defaults.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/sync/merge.js" defer></script>
  <script src="js/sync/file.js" defer></script>
  <script src="js/calc.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/screens/home.js" defer></script>
  <script src="js/screens/input.js" defer></script>
  <script src="js/screens/list.js" defer></script>
  <script src="js/screens/summary.js" defer></script>
  <script src="js/screens/balance.js" defer></script>
  <script src="js/screens/settings.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
